[theme]
base = "dark"
primaryColor = "#00D084"
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#1E222D"
textColor = "#E6E9EF"
font = "sans serif"

[server]
headless = true
port = 8501
enableXsrfProtection = true

[client]
toolbarMode = "minimal"
showErrorDetails = false

[browser]
gatherUsageStats = false
