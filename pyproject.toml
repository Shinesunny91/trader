[project]
name = "nse-intraday-ai"
version = "0.1.0"
description = "Local NSE intraday signal research and paper-trading workspace"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "plotly>=5.18",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "streamlit>=1.35",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
