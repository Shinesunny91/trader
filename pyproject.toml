[project]
name = "nse-intraday-ai"
version = "0.3.0"
description = "NSE overnight gap-reversal short book: data, ML ranker, paper trading and dashboard"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=15.0",
    "plotly>=5.18",
    "requests>=2.31",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "streamlit>=1.35",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
